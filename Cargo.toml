[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Command line tools for working with GitHub projects"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
keyring = "3"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
webbrowser = "1.0"
